<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fire &amp; Fury — Choose Your Side</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cinzel+Decorative:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #f0e6cc;
    --parchment-dark: #d9c89a;
    --ink: #0e0a04;
    --union-blue: #1a3a5c;
    --union-mid: #2557a0;
    --union-light: #3d7cc9;
    --union-shine: #6aaee8;
    --rebel-red: #7a0c0c;
    --rebel-mid: #b81c1c;
    --rebel-light: #d94040;
    --rebel-shine: #f07070;
    --gold: #c8941a;
    --gold-light: #f0c040;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    font-family: 'Source Serif 4', serif;
    background: #0a0704;
    color: var(--parchment);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* BANNER */
  .banner-wrap { position: relative; width: 100%; overflow: hidden; flex-shrink: 0; }
  .banner-img { width: 100%; display: block; object-fit: cover; max-height: 340px; filter: sepia(20%) contrast(1.08) brightness(0.85); }
  .banner-wrap::before {
    content: ''; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(to bottom, rgba(10,7,4,0.5) 0%, transparent 28%, transparent 55%, rgba(10,7,4,0.9) 100%);
  }
  .banner-wrap::after {
    content: ''; position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(ellipse at 0% 50%, rgba(10,7,4,0.5) 0%, transparent 42%), radial-gradient(ellipse at 100% 50%, rgba(10,7,4,0.5) 0%, transparent 42%);
  }
  .banner-title {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 2; text-align: center; pointer-events: none; width: 100%; padding: 0 16px;
  }
  .banner-title .fire {
    font-family: 'Cinzel Decorative', serif; font-size: clamp(2rem,5vw,4.2rem); font-weight: 900;
    letter-spacing: 0.08em; color: var(--parchment); line-height: 1;
    text-shadow: 0 0 30px rgba(200,148,26,0.9), 0 0 60px rgba(200,148,26,0.5), 2px 3px 8px rgba(0,0,0,0.8);
  }
  .banner-title .fire span { color: var(--gold-light); }
  .banner-title .sub {
    font-family: 'Playfair Display', serif; font-size: clamp(0.65rem,1.5vw,0.95rem);
    letter-spacing: 0.32em; text-transform: uppercase; color: var(--parchment-dark);
    margin-top: 8px; text-shadow: 0 1px 6px rgba(0,0,0,0.9); font-style: italic;
  }

  /* STAGE */
  .stage {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 52px 24px 64px;
    background: radial-gradient(ellipse at 50% 0%, rgba(200,148,26,0.07) 0%, transparent 60%), linear-gradient(to bottom, #0a0704 0%, #12100c 100%);
  }
  .ornament { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; width: 100%; max-width: 520px; }
  .ornament-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); }
  .ornament-star { color: var(--gold); font-size: 1.1rem; text-shadow: 0 0 12px rgba(200,148,26,0.8); }
  .choose-text {
    font-family: 'Playfair Display', serif; font-size: clamp(0.9rem,2vw,1.15rem);
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--parchment-dark);
    margin-bottom: 52px; font-style: italic; text-align: center;
  }

  /* BUTTONS */
  .sides { display: flex; gap: clamp(20px,5vw,68px); align-items: stretch; justify-content: center; flex-wrap: wrap; }
  .side-btn {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: clamp(190px,28vw,272px); padding: 38px 28px 32px;
    border: none; border-radius: 4px; cursor: pointer; text-decoration: none; color: white;
    font-family: 'Cinzel Decorative', serif;
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    user-select: none; -webkit-tap-highlight-color: transparent; outline: none;
  }

  /* 3-D stacked shadow */
  .side-btn.union {
    background: linear-gradient(155deg, var(--union-shine) 0%, var(--union-mid) 38%, var(--union-blue) 100%);
    border: 1.5px solid rgba(100,160,220,0.35); border-bottom: none;
    box-shadow:
      0 1px 0 #4d90d0, 0 2px 0 #3d7cc9, 0 3px 0 #2d68b0, 0 4px 0 #1e549a,
      0 5px 0 #124080, 0 6px 0 #0a2c66, 0 7px 0 #061c50, 0 8px 0 #03103a,
      0 14px 22px rgba(0,0,0,0.65), 0 22px 44px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 rgba(0,0,0,0.25);
  }
  .side-btn.rebel {
    background: linear-gradient(155deg, var(--rebel-shine) 0%, var(--rebel-mid) 38%, var(--rebel-red) 100%);
    border: 1.5px solid rgba(220,100,100,0.3); border-bottom: none;
    box-shadow:
      0 1px 0 #d94040, 0 2px 0 #c93030, 0 3px 0 #b82020, 0 4px 0 #a41414,
      0 5px 0 #8e0c0c, 0 6px 0 #760606, 0 7px 0 #600202, 0 8px 0 #4a0000,
      0 14px 22px rgba(0,0,0,0.65), 0 22px 44px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -1px 0 rgba(0,0,0,0.25);
  }
  .side-btn:hover { transform: translateY(-4px); filter: brightness(1.09); }
  .side-btn.union:hover {
    box-shadow:
      0 1px 0 #4d90d0, 0 2px 0 #3d7cc9, 0 3px 0 #2d68b0, 0 4px 0 #1e549a,
      0 5px 0 #124080, 0 6px 0 #0a2c66, 0 7px 0 #061c50, 0 8px 0 #03103a,
      0 9px 0 #010828, 0 10px 0 #000418,
      0 18px 30px rgba(0,0,0,0.7), 0 28px 52px rgba(0,0,0,0.38),
      inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -1px 0 rgba(0,0,0,0.25);
  }
  .side-btn.rebel:hover {
    box-shadow:
      0 1px 0 #d94040, 0 2px 0 #c93030, 0 3px 0 #b82020, 0 4px 0 #a41414,
      0 5px 0 #8e0c0c, 0 6px 0 #760606, 0 7px 0 #600202, 0 8px 0 #4a0000,
      0 9px 0 #360000, 0 10px 0 #240000,
      0 18px 30px rgba(0,0,0,0.7), 0 28px 52px rgba(0,0,0,0.38),
      inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 rgba(0,0,0,0.25);
  }
  .side-btn:active { transform: translateY(7px) !important; filter: brightness(0.9); }
  .side-btn.union:active {
    box-shadow: 0 1px 0 #061c50, 0 5px 14px rgba(0,0,0,0.55), inset 0 2px 6px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12) !important;
  }
  .side-btn.rebel:active {
    box-shadow: 0 1px 0 #600202, 0 5px 14px rgba(0,0,0,0.55), inset 0 2px 6px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12) !important;
  }

  /* Shine sweep */
  .side-btn::before {
    content: ''; position: absolute; inset: 0; border-radius: 4px; pointer-events: none;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.14) 50%, transparent 70%);
    background-size: 200% 100%; background-position: -100% 0;
    transition: background-position 0.55s ease;
  }
  .side-btn:hover::before { background-position: 200% 0; }

  .btn-badge {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #0e0a04;
    font-family: 'Playfair Display', serif; font-size: 0.58rem; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    padding: 3px 10px; border-radius: 2px; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    white-space: nowrap;
  }
  .btn-emblem { font-size: clamp(2.2rem,5vw,3rem); margin-bottom: 14px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); line-height: 1; }
  .btn-title { font-size: clamp(0.82rem,2vw,1rem); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.5); line-height: 1.2; text-align: center; }
  .btn-sub { font-family: 'Source Serif 4', serif; font-size: clamp(0.62rem,1.1vw,0.72rem); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.75; margin-top: 7px; font-style: italic; font-weight: 300; text-align: center; }

  .vs-divider {
    display: flex; align-items: center; justify-content: center; align-self: center;
    color: var(--gold); font-family: 'Playfair Display', serif;
    font-size: clamp(1.1rem,2.5vw,1.6rem); font-style: italic;
    text-shadow: 0 0 20px rgba(200,148,26,0.8); padding: 0 4px; flex-shrink: 0;
  }

  footer {
    text-align: center; padding: 18px;
    font-size: 0.62rem; letter-spacing: 0.14em; color: rgba(200,148,26,0.3);
    text-transform: uppercase; font-family: 'Playfair Display', serif;
    border-top: 1px solid rgba(200,148,26,0.08);
  }

  /* Animations */
  @keyframes fadeUp { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:translateY(0); } }
  .ornament     { animation: fadeUp 0.65s ease 0.1s both; }
  .choose-text  { animation: fadeUp 0.65s ease 0.25s both; }
  .side-btn.union  { animation: fadeUp 0.65s ease 0.4s both; }
  .vs-divider      { animation: fadeUp 0.65s ease 0.55s both; }
  .side-btn.rebel  { animation: fadeUp 0.65s ease 0.7s both; }

  @media (max-width: 520px) {
    .sides { gap: 18px; }
    .side-btn { width: 155px; padding: 28px 14px 22px; }
    .vs-divider { font-size: 0.95rem; }
  }
</style>
</head>
